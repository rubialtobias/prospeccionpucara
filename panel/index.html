<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prospección Pucará</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: barra superior, embudo de 6 etapas en una fila, luego rubros + pendientes, y la tabla de leads con su ficha lateral */
  :root {
    --bg: #f5f7f6;
    --surface: #ffffff;
    --ink: #17231f;
    --muted: #5d6b66;
    --line: #dfe5e2;
    --accent: #0f6b5c;
    --accent-soft: #dcefe9;
    --ok: #1d7a3e;   --ok-soft: #dff3e5;
    --warn: #9a6200; --warn-soft: #fbefd6;
    --bad: #b3382c;  --bad-soft: #f8e1de;
    --info: #2f5f9e; --info-soft: #e1ebf8;
    --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614; --surface: #172019; --ink: #e5ece9; --muted: #95a39e; --line: #2a3531;
      --accent: #4fc2a9; --accent-soft: #163a32;
      --ok: #6fd393; --ok-soft: #173a24; --warn: #e8b45a; --warn-soft: #3d2f14;
      --bad: #f08a7e; --bad-soft: #43201c; --info: #8ab4ee; --info-soft: #1b2c44;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614; --surface: #172019; --ink: #e5ece9; --muted: #95a39e; --line: #2a3531;
    --accent: #4fc2a9; --accent-soft: #163a32;
    --ok: #6fd393; --ok-soft: #173a24; --warn: #e8b45a; --warn-soft: #3d2f14;
    --bad: #f08a7e; --bad-soft: #43201c; --info: #8ab4ee; --info-soft: #1b2c44;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
  .wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  header .meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
  .dot.off { background: var(--bad); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

  /* Embudo */
  .embudo { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; }
  .etapa { padding: 14px 16px 16px; border-left: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
  .etapa:first-child { border-left: 0; }
  .etapa .nombre { font-size: 13px; color: var(--muted); font-weight: 500; }
  .etapa .valor { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .etapa .barra { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .etapa .barra span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .etapa .conv { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
  @media (max-width: 900px) {
    .embudo { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .etapa:nth-child(4) { border-left: 0; }
    .etapa:nth-child(n+4) { border-top: 1px solid var(--line); }
  }

  .fila { display: grid; grid-template-columns: 1.3fr 1fr 0.8fr; gap: 20px; }
  @media (max-width: 900px) { .fila { grid-template-columns: 1fr; } }
  .panel > h2 { margin-bottom: 12px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }

  .hoy .grande { font-family: var(--font-display); font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hoy .grande small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .medidor { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 10px 0 8px; }
  .medidor span { display: block; height: 100%; background: var(--accent); }
  .nota-chica { font-size: 13px; color: var(--muted); }

  .lista { display: grid; gap: 8px; }
  .lista button { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
  .lista button:hover, .lista button:focus-visible { border-color: var(--accent); }
  .lista .sub { font-size: 13px; color: var(--muted); }
  .vacio { color: var(--muted); font-size: 14px; padding: 6px 0; }

  /* Pastillas de estado */
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--line); color: var(--ink); }
  .pill.si, .pill.reunion, .pill.cliente { background: var(--ok-soft); color: var(--ok); }
  .pill.dudoso, .pill.seguimiento { background: var(--warn-soft); color: var(--warn); }
  .pill.no, .pill.descartado, .pill.no_interesado { background: var(--bad-soft); color: var(--bad); }
  .pill.enviado, .pill.con_email { background: var(--info-soft); color: var(--info); }
  .pill.respondio { background: var(--accent); color: var(--surface); }

  /* Filtros y tabla de leads */
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .filtros h2 { margin-right: auto; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #buscar { min-width: 0; width: 220px; max-width: 100%; }
  #tabla tbody tr { cursor: pointer; }
  #tabla tbody tr:hover td { background: var(--accent-soft); }
  #tabla tbody tr.activo td { background: var(--accent-soft); }
  .quien { font-weight: 600; }
  .gris { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }

  /* Ficha lateral */
  .ficha { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,0.12); padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); overflow-y: auto; display: grid; gap: 16px; align-content: start; z-index: 20; }
  .ficha header { align-items: start; }
  .ficha h3 { font-family: var(--font-display); font-size: 20px; margin: 0; }
  .cerrar { all: unset; cursor: pointer; font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 6px; color: var(--muted); }
  .cerrar:hover { color: var(--ink); }
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .snippet { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px; }
  .campo { display: grid; gap: 6px; }
  .campo label { font-size: 13px; font-weight: 600; }
  textarea { min-height: 80px; resize: vertical; }
  .boton { font: inherit; font-weight: 600; background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; justify-self: start; }
  .guardado { font-size: 13px; color: var(--ok); }
  .historial { display: grid; gap: 6px; font-size: 13px; }
  .historial div { display: flex; gap: 8px; }
  .historial .fecha { font-family: var(--font-mono); color: var(--muted); white-space: nowrap; }
  .conv .corto { display: none; }

  .correo { display: grid; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .correo-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .correo h4 { margin: 0; font-family: var(--font-display); font-size: 15px; }
  .correo input, .correo textarea { background: var(--surface); width: 100%; }
  .correo textarea { line-height: 1.45; }
  .correo textarea:disabled, .correo input:disabled { opacity: 0.75; }
  .correo summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
  .correo details[open] summary { margin-bottom: 10px; }
  .correo details .campo + .campo { margin-top: 10px; }
  .correo p { margin: 0; font-size: 13px; }
  .correo-acciones { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .boton.secundario { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  a.boton { display: inline-block; text-decoration: none; text-align: center; }

  /* Celular: embudo como lista, leads como tarjetas, ficha a pantalla completa */
  @media (max-width: 640px) {
    .wrap { gap: 14px; padding-block: 14px 32px; }
    h1 { font-size: 19px; }
    header .meta { font-size: 12px; gap: 10px; }

    .embudo { grid-template-columns: 1fr; padding-block: 6px; }
    .etapa { grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 14px; border-left: 0; border-top: 0 !important; }
    .etapa .nombre { grid-column: 1; grid-row: 1; }
    .etapa .barra { grid-column: 2; grid-row: 1; }
    .etapa .valor { grid-column: 3; grid-row: 1; font-size: 20px; text-align: right; min-width: 2.5ch; }
    .etapa .conv { grid-column: 2 / 4; grid-row: 2; font-size: 11px; margin-top: -4px; }
    .etapa:first-child .conv { display: none; }
    .conv .largo { display: none; }
    .conv .corto { display: inline; }

    .fila { gap: 14px; }
    .fila .hoy { order: -2; }
    .fila .pendientes { order: -1; }
    .panel { padding: 14px; }
    .hoy .grande { font-size: 28px; }

    .filtros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .filtros h2 { grid-column: 1 / -1; }
    #buscar { grid-column: 1 / -1; width: 100%; }
    .filtros select { width: 100%; min-width: 0; padding-inline: 6px; }
    /* 16px evita que el iPhone haga zoom al tocar un campo */
    input, select, textarea { font-size: 16px; }

    .scroll.leads { overflow: visible; margin-inline: -14px; }
    #tabla thead { display: none; }
    #tabla, #tabla tbody { display: block; }
    #tabla tbody tr {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; padding: 12px 14px;
      border-top: 1px solid var(--line);
      grid-template-areas: "persona estado" "empresa empresa" "email email" "califica fecha";
    }
    #tabla tbody td { display: block; padding: 0; border: 0; min-width: 0; }
    #tabla tbody tr:hover td, #tabla tbody tr.activo td { background: none; }
    #tabla tbody tr:hover, #tabla tbody tr.activo { background: var(--accent-soft); }
    #tabla .c-persona { grid-area: persona; }
    #tabla .c-estado { grid-area: estado; justify-self: end; }
    #tabla .c-empresa { grid-area: empresa; font-size: 14px; }
    #tabla .c-email { grid-area: email; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tabla .c-califica { grid-area: califica; margin-top: 4px; }
    #tabla .c-fecha { grid-area: fecha; justify-self: end; margin-top: 4px; font-size: 12px; }
    #tabla .c-ciudad { display: none; }
    #tabla .c-email:empty, #tabla .c-email .gris { display: none; }
    #tabla td.vacio { padding: 12px 14px; }

    .ficha { width: 100vw; border-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .ficha header { position: sticky; top: 0; background: var(--surface); padding-block: 4px 10px; z-index: 1; }
    .cerrar { font-size: 28px; padding: 6px 10px; }
    dl { grid-template-columns: 84px minmax(0, 1fr); }
    .boton { width: 100%; padding-block: 12px; text-align: center; }
    .ficha .acciones { flex-direction: column; align-items: stretch !important; }
    .correo { padding: 12px; }
  }

  .login { max-width: 420px; width: 100%; margin: 12vh auto 0; display: grid; gap: 12px; }
  .login-form { display: grid; gap: 14px; }
  .login-form .boton { width: 100%; padding-block: 11px; }
  .login-form .boton:disabled { opacity: 0.6; cursor: wait; }
  .enlace { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; }
  .enlace:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .etapa .barra span, .medidor span { transition: width 0.4s ease; } }
</style>
</head>
<body>
<!-- Login del panel online. En la versión local (npm run panel) no aparece. -->
<div class="wrap" id="login" hidden>
  <section class="panel login">
    <h1>Prospección Pucará</h1>
    <p class="gris">Ingresá con tu email y contraseña. Solo tienen acceso los usuarios autorizados.</p>
    <form id="form-login" class="login-form">
      <div class="campo">
        <label for="email-login">Email</label>
        <input id="email-login" type="email" required autocomplete="username" placeholder="tu@email.com">
      </div>
      <div class="campo">
        <label for="clave-login">Contraseña</label>
        <input id="clave-login" type="password" required autocomplete="current-password">
      </div>
      <button class="boton" type="submit" id="entrar">Entrar</button>
      <span class="gris" id="login-mensaje" role="status"></span>
    </form>
  </section>
</div>

<div class="wrap" id="app">
  <header>
    <h1>Prospección Pucará</h1>
    <div class="meta">
      <span id="conexion"><span class="dot"></span>Conectado</span>
      <span>Actualizado <span id="actualizado" class="num">—</span></span>
      <button class="enlace" id="salir" hidden>Salir</button>
    </div>
  </header>

  <section class="panel embudo" id="embudo" aria-label="Embudo"></section>

  <div class="fila">
    <section class="panel">
      <h2>Por rubro</h2>
      <div class="scroll"><table id="rubros"></table></div>
    </section>
    <section class="panel pendientes">
      <h2>Para responder</h2>
      <div class="lista" id="pendientes"></div>
    </section>
    <section class="panel hoy">
      <h2>Envíos de hoy</h2>
      <div class="grande"><span id="hoy-enviados">0</span> <small>de <span id="hoy-limite">10</span></small></div>
      <div class="medidor"><span id="hoy-barra" style="width:0%"></span></div>
      <div class="nota-chica" id="hoy-texto"></div>
    </section>
  </div>

  <section class="panel">
    <div class="filtros">
      <h2>Leads <span class="num" id="contador"></span></h2>
      <input id="buscar" type="search" placeholder="Buscar nombre o empresa" aria-label="Buscar nombre o empresa">
      <select id="f-encaja" aria-label="Filtrar por calificación">
        <option value="">Calificación</option>
        <option value="si">Encajan</option>
        <option value="dudoso">Dudosos</option>
        <option value="no">No encajan</option>
        <option value="sin">Sin calificar</option>
      </select>
      <select id="f-estado" aria-label="Filtrar por estado"><option value="">Estado</option></select>
      <select id="f-rubro" aria-label="Filtrar por rubro"><option value="">Rubro</option></select>
      <select id="f-borrador" aria-label="Filtrar por mensaje">
        <option value="">Mensaje</option>
        <option value="pendiente">Email por aprobar</option>
        <option value="aprobado">Email aprobado</option>
        <option value="descartado">Email descartado</option>
        <option value="whatsapp">WhatsApp para mandar</option>
        <option value="instagram">Instagram para mandar</option>
      </select>
    </div>
    <div class="scroll leads">
      <table id="tabla">
        <thead><tr><th>Persona</th><th>Empresa</th><th>Email</th><th>Ciudad</th><th>Califica</th><th>Estado</th><th>Último contacto</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<aside class="ficha" id="ficha" hidden aria-label="Ficha del lead"></aside>

<!-- config.js solo existe en la versión online: define window.PANEL_CONFIG con la URL y la clave pública de Supabase -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const NOMBRE_ESTADO = {
  nuevo: 'Nuevo', con_email: 'Con email', enviado: 'Enviado', seguimiento: 'En seguimiento',
  respondio: 'Respondió', reunion: 'Reunión', cliente: 'Cliente', no_interesado: 'No le interesa', descartado: 'Descartado',
};
const NOMBRE_ENCAJA = { si: 'Encaja', dudoso: 'Dudoso', no: 'No encaja' };
const CONTACTADO = ['enviado', 'seguimiento', 'respondio', 'reunion', 'cliente', 'no_interesado'];
const RESPONDIO = ['respondio', 'reunion', 'cliente', 'no_interesado'];
const REUNION = ['reunion', 'cliente'];

let datos = { leads: [], estados: [], limiteDiario: 10 };
let abierto = null;

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Los de Google Maps no traen persona: se muestra el negocio
const quien = (l) => [l.nombre, l.apellido].filter(Boolean).join(' ') || (l.fuente === 'maps' ? l.empresa : 'Sin nombre');
const hoyIso = () => new Date().toISOString().slice(0, 10);
const envios = (l) => (l.historial ?? []).filter((h) => h.tipo === 'envio' && (h.canal ?? 'email') === 'email');
const enviadoAMano = (l) => (l.historial ?? []).some((h) => h.tipo === 'envio' && ['whatsapp', 'instagram'].includes(h.canal));
const ultimoContacto = (l) => (l.historial ?? []).filter((h) => h.tipo === 'envio' || h.tipo === 'respuesta').at(-1);
const fecha = (iso) => iso ? new Date(iso).toLocaleDateString('es-AR', { day: '2-digit', month: 'short' }) : '';
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function pintarEmbudo() {
  const L = datos.leads;
  const etapas = [
    ['Encontrados', L.length],
    ['Encajan', L.filter((l) => l.encaja === 'si').length],
    // Solo los que encajan: los dudosos con email no se contactan hasta revisarlos
    ['Con email', L.filter((l) => l.encaja === 'si' && l.email).length],
    ['Enviados', L.filter((l) => CONTACTADO.includes(l.estado)).length],
    ['Respondieron', L.filter((l) => RESPONDIO.includes(l.estado)).length],
    ['Reuniones', L.filter((l) => REUNION.includes(l.estado)).length],
  ];
  const total = etapas[0][1];
  $('#embudo').innerHTML = etapas.map(([nombre, n], i) => `
    <div class="etapa">
      <div class="nombre">${nombre}</div>
      <div class="valor">${n}</div>
      <div class="barra"><span style="width:${pct(n, total)}%"></span></div>
      <div class="conv">${i === 0 ? 'total' : `<span class="largo">${pct(n, etapas[i - 1][1])}% del paso anterior</span><span class="corto">${pct(n, etapas[i - 1][1])}% de ${etapas[i - 1][0].toLowerCase()}</span>`}</div>
    </div>`).join('');
}

function pintarRubros() {
  const rubros = [...new Set(datos.leads.map((l) => l.rubro))];
  const fila = (r) => {
    const L = datos.leads.filter((l) => l.rubro === r);
    const c = (f) => L.filter(f).length;
    return `<tr><td>${esc(r)}</td><td class="n">${L.length}</td><td class="n">${c((l) => l.encaja === 'si')}</td><td class="n">${c((l) => CONTACTADO.includes(l.estado))}</td><td class="n">${c((l) => RESPONDIO.includes(l.estado))}</td></tr>`;
  };
  $('#rubros').innerHTML = `<thead><tr><th>Rubro</th><th class="n">Leads</th><th class="n">Encajan</th><th class="n">Enviados</th><th class="n">Respuestas</th></tr></thead><tbody>${rubros.map(fila).join('')}</tbody>`;
}

function pintarPendientes() {
  const p = datos.leads.filter((l) => l.estado === 'respondio');
  $('#pendientes').innerHTML = p.length
    ? p.map((l) => `<button data-url="${esc(l.linkedin_url)}"><span class="quien">${esc(quien(l))}</span><span class="sub">${esc(l.empresa)} · respondió ${fecha(ultimoContacto(l)?.fecha)}</span></button>`).join('')
    : '<div class="vacio">Nadie esperando respuesta. Cuando alguien conteste un email, aparece acá.</div>';
}

function pintarHoy() {
  const n = datos.leads.reduce((s, l) => s + envios(l).filter((e) => e.fecha.startsWith(hoyIso())).length, 0);
  const lim = datos.limiteDiario;
  $('#hoy-enviados').textContent = n;
  $('#hoy-limite').textContent = lim;
  $('#hoy-barra').style.width = `${Math.min(100, pct(n, lim))}%`;
  const sinEnviar = datos.leads.filter((l) => l.estado === 'con_email' && l.encaja === 'si');
  const aprobados = sinEnviar.filter((l) => l.borrador?.estado === 'aprobado').length;
  const porAprobar = sinEnviar.filter((l) => l.borrador?.estado === 'pendiente').length;
  const aMano = datos.leads.filter((l) => l.encaja === 'si' && l.mensaje_manual && !enviadoAMano(l)).length;
  const listos = aprobados === 1 ? '1 email aprobado listo para salir' : `${aprobados} emails aprobados listos para salir`;
  $('#hoy-texto').textContent = `${listos}${porAprobar ? `, ${porAprobar} por aprobar` : ''}.` +
    (n === 0 ? '' : ` Quedan ${Math.max(0, lim - n)} envíos hoy.`) +
    (aMano ? ` ${aMano} mensajes para mandar a mano por WhatsApp o Instagram.` : '');
}

function filtrados() {
  const q = $('#buscar').value.trim().toLowerCase();
  const fe = $('#f-encaja').value, fs = $('#f-estado').value, fr = $('#f-rubro').value, fb = $('#f-borrador').value;
  return datos.leads.filter((l) =>
    (!q || `${quien(l)} ${l.empresa}`.toLowerCase().includes(q)) &&
    (!fe || (fe === 'sin' ? !l.encaja : l.encaja === fe)) &&
    (!fs || l.estado === fs) &&
    (!fr || l.rubro === fr) &&
    (!fb || (['whatsapp', 'instagram'].includes(fb) ? l.mensaje_manual?.canal === fb && !enviadoAMano(l) : l.borrador?.estado === fb)));
}

function pintarTabla() {
  const lista = filtrados();
  $('#contador').textContent = `${lista.length}`;
  $('#tabla tbody').innerHTML = lista.length ? lista.map((l) => `
    <tr data-url="${esc(l.linkedin_url)}" class="${l.linkedin_url === abierto ? 'activo' : ''}" tabindex="0">
      <td class="c-persona"><div class="quien">${esc(quien(l))}</div><div class="gris">${esc(l.cargo || l.categoria)}</div></td>
      <td class="c-empresa">${esc(l.empresa) || '<span class="gris">—</span>'}</td>
      <td class="c-email">${esc(l.email) || '<span class="gris">—</span>'}</td>
      <td class="c-ciudad">${esc(l.ubicacion) || '<span class="gris">—</span>'}</td>
      <td class="c-califica">${l.encaja ? `<span class="pill ${esc(l.encaja)}">${NOMBRE_ENCAJA[l.encaja] ?? esc(l.encaja)}</span>` : '<span class="gris">Sin calificar</span>'}</td>
      <td class="c-estado"><span class="pill ${esc(l.estado)}">${NOMBRE_ESTADO[l.estado] ?? esc(l.estado)}</span></td>
      <td class="c-fecha gris">${fecha(ultimoContacto(l)?.fecha)}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="vacio">Ningún lead coincide con estos filtros.</td></tr>';
}

function llenarSelect(sel, valores, nombres) {
  const actual = sel.value;
  const primera = sel.options[0].outerHTML;
  sel.innerHTML = primera + valores.map((v) => `<option value="${esc(v)}">${esc(nombres?.[v] ?? v)}</option>`).join('');
  sel.value = valores.includes(actual) ? actual : '';
}

function pintarFicha() {
  const f = $('#ficha');
  const l = datos.leads.find((x) => x.linkedin_url === abierto);
  if (!l) { f.hidden = true; return; }
  if (!f.hidden && document.activeElement && f.contains(document.activeElement)) return; // no pisar lo que se está editando
  const hist = (l.historial ?? []).slice().reverse();
  f.innerHTML = `
    <header>
      <div><h3>${esc(quien(l))}</h3><div class="gris">${esc(l.cargo)}${l.empresa ? ' · ' + esc(l.empresa) : ''}</div></div>
      <button class="cerrar" id="cerrar" aria-label="Cerrar ficha">×</button>
    </header>
    <dl>
      <dt>Califica</dt><dd>${l.encaja ? `<span class="pill ${esc(l.encaja)}">${NOMBRE_ENCAJA[l.encaja]}</span> ${esc(l.motivo)}` : 'Sin calificar'}</dd>
      <dt>Email</dt><dd>${l.email ? `${esc(l.email)} <span class="gris">(${l.email_tipo === 'personal' ? 'personal' : 'genérico'})</span>` : `<span class="gris">${l.web_revisada ? 'No encontramos' : 'Todavía no lo buscamos'}</span>`}</dd>
      <dt>Web</dt><dd>${l.web ? `<a href="${esc(l.web)}" target="_blank" rel="noopener">${esc(l.web.replace(/^https?:\/\/(www\.)?/, ''))}</a>` : '<span class="gris">—</span>'}${l.web_revisada?.error ? ` <span class="gris">${esc(l.web_revisada.error)}</span>` : ''}</dd>
      <dt>WhatsApp</dt><dd class="num">${esc(l.whatsapp) || '<span class="gris">—</span>'}</dd>
      ${l.web_revisada && !l.web_revisada.error ? `<dt>Su web</dt><dd>${[
        l.web_revisada.boton_whatsapp ? 'Botón de WhatsApp' : 'Sin botón de WhatsApp',
        l.web_revisada.chat ? `Chat: ${esc(typeof l.web_revisada.chat === 'string' ? l.web_revisada.chat : 'sí')}` : 'No vimos chat en la web',
        l.web_revisada.formulario ? 'Formulario' : 'Sin formulario',
        l.web_revisada.plataforma ? `Hecha con ${esc(l.web_revisada.plataforma)}` : '',
        `Carga en ${l.web_revisada.segundos} s`,
      ].filter(Boolean).join(' · ')}</dd>` : ''}
      <dt>Ciudad</dt><dd>${esc(l.ubicacion) || '—'}</dd>
      <dt>Rubro</dt><dd>${esc(l.rubro)}</dd>
      ${l.fuente === 'maps' ? `
      <dt>Teléfono</dt><dd class="num">${esc(l.telefono) || '<span class="gris">—</span>'}</dd>
      <dt>Instagram</dt><dd>${l.instagram ? `<a href="${esc(l.instagram)}" target="_blank" rel="noopener">${esc(l.instagram.replace(/^https?:\/\/(www\.)?instagram\.com\//, '@').replace(/\/$/, ''))}</a>` : '<span class="gris">—</span>'}</dd>
      <dt>Dirección</dt><dd>${esc(l.direccion) || '—'}</dd>
      <dt>Reseñas</dt><dd>${l.calificacion ? `${esc(l.calificacion)} ★ · ${esc(l.resenas)} reseñas` : '—'}</dd>
      <dt>Maps</dt><dd><a href="${esc(l.linkedin_url)}" target="_blank" rel="noopener">Ver en Google Maps</a></dd>`
      : `<dt>LinkedIn</dt><dd><a href="${esc(l.linkedin_url)}" target="_blank" rel="noopener">Ver perfil</a></dd>`}
      <dt>Encontrado</dt><dd class="num">${esc(l.encontrado)}</dd>
    </dl>
    ${l.snippet ? `<div class="snippet">${esc(l.snippet)}</div>` : ''}
    ${l.borrador ? fichaCorreo(l) : ''}
    ${l.mensaje_manual ? fichaManual(l) : ''}
    <div class="campo">
      <label for="estado">Estado</label>
      <select id="estado">${datos.estados.map((e) => `<option value="${e}" ${e === l.estado ? 'selected' : ''}>${NOMBRE_ESTADO[e] ?? e}</option>`).join('')}</select>
    </div>
    <div class="campo">
      <label for="nota">Nota</label>
      <textarea id="nota" placeholder="Ej: pidió que lo llamemos el jueves">${esc(l.nota)}</textarea>
    </div>
    <div class="acciones" style="display:flex;gap:12px;align-items:center"><button class="boton" id="guardar">Guardar</button><span class="guardado" id="guardado"></span></div>
    <div class="campo">
      <label>Historial</label>
      <div class="historial">${hist.length ? hist.map((h) => `<div><span class="fecha">${fecha(h.fecha)}</span><span>${h.tipo === 'estado' ? `Pasó de ${NOMBRE_ESTADO[h.de] ?? h.de} a ${NOMBRE_ESTADO[h.a] ?? h.a}` : h.tipo === 'envio' ? (h.canal && h.canal !== 'email' ? `Mensaje enviado por ${NOMBRE_CANAL[h.canal] ?? esc(h.canal)}` : `Email enviado: ${esc(h.asunto ?? '')}`) : h.tipo === 'respuesta' ? 'Respondió' : esc(h.tipo)}</span></div>`).join('') : '<span class="gris">Sin movimientos todavía.</span>'}</div>
    </div>`;
  f.hidden = false;
  $('#cerrar').onclick = () => { abierto = null; f.hidden = true; pintarTabla(); };
  $('#guardar').onclick = guardar;
  if (l.mensaje_manual && !enviadoAMano(l)) prepararManual(l);
  if (l.borrador && !yaEnviado(l)) {
    $('#aprobar').onclick = () => guardarBorrador('aprobado');
    $('#descartar-borrador').onclick = () => guardarBorrador('descartado');
    $('#pendiente-borrador')?.addEventListener('click', () => guardarBorrador('pendiente'));
  }
}

const NOMBRE_BORRADOR = { pendiente: 'Por aprobar', aprobado: 'Aprobado', descartado: 'Descartado' };
const yaEnviado = (l) => envios(l).length > 0;

function fichaCorreo(l) {
  const b = l.borrador;
  const enviado = yaEnviado(l);
  const bloqueo = enviado ? 'disabled' : '';
  const estado = enviado ? 'Enviado' : NOMBRE_BORRADOR[b.estado] ?? b.estado;
  const clase = enviado ? 'enviado' : { pendiente: 'seguimiento', aprobado: 'si', descartado: 'no' }[b.estado];
  return `
    <section class="correo" aria-label="Email a enviar">
      <div class="correo-cab"><h4>Email a enviar</h4><span class="pill ${clase}">${estado}</span></div>
      <div class="campo"><label for="b-asunto">Asunto</label><input id="b-asunto" value="${esc(b.asunto)}" ${bloqueo}></div>
      <div class="campo"><label for="b-cuerpo">Mensaje</label><textarea id="b-cuerpo" rows="13" ${bloqueo}>${esc(b.cuerpo)}</textarea></div>
      <details>
        <summary>Seguimientos, si no responde (día 3 y día 7)</summary>
        <div class="campo"><label for="b-seg1">Día 3</label><textarea id="b-seg1" rows="7" ${bloqueo}>${esc(b.seguimiento1)}</textarea></div>
        <div class="campo"><label for="b-seg2">Día 7</label><textarea id="b-seg2" rows="6" ${bloqueo}>${esc(b.seguimiento2)}</textarea></div>
      </details>
      ${enviado ? '' : `<div class="acciones correo-acciones">
        <button class="boton" id="aprobar">${b.estado === 'aprobado' ? 'Guardar cambios' : 'Aprobar'}</button>
        ${b.estado === 'descartado'
          ? '<button class="boton secundario" id="pendiente-borrador">Volver a por aprobar</button><button hidden id="descartar-borrador"></button>'
          : '<button class="boton secundario" id="descartar-borrador">Descartar</button>'}
        <span class="guardado" id="b-guardado"></span>
      </div>`}
      ${b.estado === 'aprobado' && !enviado ? '<p class="gris">Sale en el próximo envío diario, según el límite del día.</p>' : ''}
    </section>`;
}

const NOMBRE_CANAL = { whatsapp: 'WhatsApp', instagram: 'Instagram' };
const linkWhatsapp = (numero, texto) => `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;

function fichaManual(l) {
  const m = l.mensaje_manual;
  const hecho = (l.historial ?? []).find((h) => h.tipo === 'envio' && h.canal === m.canal);
  const oferta = m.oferta === 'web' ? 'página web' : 'agente de IA';
  return `
    <section class="correo" aria-label="Mensaje para mandar a mano">
      <div class="correo-cab"><h4>Mensaje por ${NOMBRE_CANAL[m.canal]} · ${oferta}</h4>
        <span class="pill ${hecho ? 'enviado' : 'seguimiento'}">${hecho ? `Enviado ${fecha(hecho.fecha)}` : 'Para mandar'}</span></div>
      <div class="campo"><label for="m-texto">Mensaje</label><textarea id="m-texto" rows="10" ${hecho ? 'disabled' : ''}>${esc(m.texto)}</textarea></div>
      ${hecho ? '' : `<div class="acciones correo-acciones">
        ${m.canal === 'whatsapp'
          ? `<a class="boton" id="abrir-manual" href="${esc(linkWhatsapp(m.numero, m.texto))}" target="_blank" rel="noopener">Abrir WhatsApp con el mensaje</a>`
          : `<button class="boton" id="copiar-manual" type="button">Copiar mensaje</button>
             <a class="boton secundario" href="${esc(m.instagram)}" target="_blank" rel="noopener">Abrir Instagram</a>`}
        <button class="boton secundario" id="marcar-manual" type="button">Ya lo mandé</button>
        <span class="guardado" id="m-guardado"></span>
      </div>
      <p class="gris">${m.canal === 'whatsapp'
        ? `Se abre WhatsApp con el mensaje escrito para el ${esc(m.numero)}. Revisalo, mandalo y después tocá "Ya lo mandé".`
        : 'Copiá el mensaje, abrí su Instagram y mandáselo por mensaje directo. Después tocá "Ya lo mandé".'}</p>`}
    </section>`;
}

function prepararManual(l) {
  const m = l.mensaje_manual;
  // Si editás el texto, el botón de WhatsApp abre con la versión editada
  $('#m-texto').addEventListener('input', () => {
    const a = $('#abrir-manual');
    if (a) a.href = linkWhatsapp(m.numero, $('#m-texto').value);
  });
  $('#copiar-manual')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText($('#m-texto').value);
      $('#m-guardado').textContent = 'Copiado';
    } catch {
      $('#m-texto').select();
      $('#m-guardado').textContent = 'Seleccioné el texto: copialo con Ctrl+C';
    }
  });
  $('#marcar-manual').addEventListener('click', async () => {
    try {
      const res = await fuente.guardar({ linkedin_url: l.linkedin_url, estado: 'enviado', envio: { canal: m.canal, asunto: `Mensaje por ${NOMBRE_CANAL[m.canal]}` } });
      datos.leads[datos.leads.findIndex((x) => x.linkedin_url === l.linkedin_url)] = res;
    } catch (e) {
      $('#m-guardado').textContent = `No se pudo guardar: ${e.message}`;
      return;
    }
    pintar();
  });
}

async function guardarBorrador(estadoNuevo) {
  const l = datos.leads.find((x) => x.linkedin_url === abierto);
  const borrador = {
    ...l.borrador,
    asunto: $('#b-asunto').value.trim().slice(0, 200),
    cuerpo: $('#b-cuerpo').value.slice(0, 5000),
    seguimiento1: $('#b-seg1').value.slice(0, 3000),
    seguimiento2: $('#b-seg2').value.slice(0, 3000),
    estado: estadoNuevo,
    revisado: new Date().toISOString(),
  };
  if (estadoNuevo === 'aprobado' && (!borrador.asunto || !borrador.cuerpo.trim())) {
    $('#b-guardado').textContent = 'Falta el asunto o el mensaje.';
    return;
  }
  try {
    const res = await fuente.guardar({ linkedin_url: abierto, borrador });
    datos.leads[datos.leads.findIndex((x) => x.linkedin_url === abierto)] = res;
  } catch (e) {
    $('#b-guardado').textContent = `No se pudo guardar: ${e.message}`;
    return;
  }
  document.activeElement?.blur();
  pintar();
  $('#b-guardado').textContent = { aprobado: 'Aprobado', descartado: 'Descartado', pendiente: 'Guardado' }[estadoNuevo];
}

// Dos fuentes de datos: el servidor local (npm run panel) o Supabase (panel online)
const CONFIG = window.PANEL_CONFIG;
const sb = CONFIG?.supabaseUrl && window.supabase ? window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey) : null;
const ESTADOS = ['nuevo', 'con_email', 'enviado', 'seguimiento', 'respondio', 'reunion', 'cliente', 'no_interesado', 'descartado'];

const fuente = sb ? {
  async leer() {
    const leads = [];
    for (let desde = 0; ; desde += 1000) {
      let { data, error } = await sb.from('leads').select('datos, estado, nota, historial, borrador, actualizado_panel').range(desde, desde + 999);
      // Sin la columna de borradores (falta correr supabase/02-borradores.sql) el panel sigue andando
      if (error?.code === '42703') ({ data, error } = await sb.from('leads').select('datos, estado, nota, historial, actualizado_panel').range(desde, desde + 999));
      if (error) throw error;
      leads.push(...data.map((r) => ({ ...r.datos, estado: r.estado, nota: r.nota, historial: r.historial, borrador: r.borrador, actualizado_panel: r.actualizado_panel })));
      if (data.length < 1000) break;
    }
    return { leads, estados: ESTADOS, limiteDiario: CONFIG.limiteDiario ?? 10 };
  },
  async guardar({ linkedin_url, estado, nota, borrador, envio }) {
    const lead = datos.leads.find((l) => l.linkedin_url === linkedin_url);
    const ahora = new Date().toISOString();
    const cambios = { actualizado_panel: ahora };
    if (estado !== undefined) {
      cambios.estado = estado;
      cambios.historial = estado !== lead.estado
        ? [...(lead.historial ?? []), { fecha: ahora, tipo: 'estado', de: lead.estado, a: estado }]
        : lead.historial ?? [];
    }
    if (nota !== undefined) cambios.nota = nota.slice(0, 2000);
    if (borrador !== undefined) cambios.borrador = borrador;
    if (envio) cambios.historial = [...(cambios.historial ?? lead.historial ?? []), { fecha: ahora, tipo: 'envio', canal: envio.canal, asunto: envio.asunto }];
    const { error } = await sb.from('leads').update(cambios).eq('linkedin_url', linkedin_url);
    if (error) throw error;
    return { ...lead, ...cambios };
  },
} : {
  async leer() {
    const r = await fetch('/api/leads');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  },
  async guardar(cuerpo) {
    const r = await fetch('/api/leads/estado', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error);
    return res;
  },
};

async function guardar() {
  let res;
  try {
    res = await fuente.guardar({ linkedin_url: abierto, estado: $('#estado').value, nota: $('#nota').value });
  } catch (e) {
    $('#guardado').textContent = `No se pudo guardar: ${e.message}`;
    return;
  }
  const i = datos.leads.findIndex((l) => l.linkedin_url === abierto);
  datos.leads[i] = res;
  document.activeElement?.blur();
  pintar();
  $('#guardado').textContent = 'Guardado';
}

function pintar() {
  llenarSelect($('#f-estado'), datos.estados, NOMBRE_ESTADO);
  llenarSelect($('#f-rubro'), [...new Set(datos.leads.map((l) => l.rubro))]);
  pintarEmbudo(); pintarRubros(); pintarPendientes(); pintarHoy(); pintarTabla(); pintarFicha();
}

async function cargar() {
  try {
    datos = await fuente.leer();
    $('#conexion').innerHTML = '<span class="dot"></span>Conectado';
    $('#actualizado').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    pintar();
  } catch (e) {
    $('#conexion').innerHTML = sb
      ? `<span class="dot off"></span>No se pudieron leer los datos: ${esc(e.message)}`
      : '<span class="dot off"></span>Sin conexión: ¿está corriendo npm run panel?';
  }
}

function mostrar(vista) {
  $('#login').hidden = vista !== 'login';
  $('#app').hidden = vista !== 'app';
  $('#salir').hidden = !sb;
}

async function iniciar() {
  if (CONFIG?.supabaseUrl && !sb) {
    $('#conexion').innerHTML = '<span class="dot off"></span>No cargó la librería de Supabase. Revisá la conexión y recargá.';
    return;
  }
  if (sb) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return mostrar('login');
  }
  abrirApp();
}

let refresco = null;
function abrirApp() {
  mostrar('app');
  cargar();
  refresco ??= setInterval(cargar, 20000);
}

$('#form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email-login').value.trim().toLowerCase();
  const password = $('#clave-login').value;
  $('#entrar').disabled = true;
  $('#login-mensaje').textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#entrar').disabled = false;
  if (!error) {
    $('#login-mensaje').textContent = '';
    $('#clave-login').value = '';
    return abrirApp();
  }
  $('#login-mensaje').textContent = /invalid login credentials/i.test(error.message)
    ? 'Email o contraseña incorrectos.'
    : /rate limit|too many/i.test(error.message)
      ? 'Demasiados intentos seguidos. Esperá unos minutos y probá de nuevo.'
      : `No se pudo entrar: ${error.message}`;
});
$('#salir').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

function abrir(url) { abierto = url; $('#ficha').hidden = true; pintarTabla(); pintarFicha(); }
document.addEventListener('click', (e) => {
  const fila = e.target.closest('#tabla tbody tr[data-url], #pendientes button[data-url]');
  if (fila) abrir(fila.dataset.url);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('#tabla tbody tr[data-url]')) abrir(e.target.dataset.url);
  if (e.key === 'Escape' && abierto) { abierto = null; $('#ficha').hidden = true; pintarTabla(); }
});
['#buscar', '#f-encaja', '#f-estado', '#f-rubro', '#f-borrador'].forEach((s) => $(s).addEventListener('input', pintarTabla));

iniciar();
</script>
</body>
</html>
